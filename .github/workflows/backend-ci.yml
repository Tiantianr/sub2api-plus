name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to verify"
        required: false
        type: string
      release-tag:
        description: "Release tag used to resolve the migration comparison base"
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Check deployment scripts
        run: |
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        working-directory: backend
        run: |
          test "$(go env GOVERSION)" = "go$(awk '/^go / { print $2 }' go.mod)"
      - name: Check Go module tidiness
        working-directory: backend
        run: go mod tidy -diff
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: frontend/package.json
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend lint, typecheck, and critical tests
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Resolve lint version
        id: tool-versions
        run: |
          VERSION="$(awk '$1 == "golangci-lint" { print $2 }' .tool-versions)"
          test -n "$VERSION"
          echo "golangci_lint=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.tool-versions.outputs.golangci_lint }}
          args: --timeout=30m
          working-directory: backend
          # Cached analyzer results can survive linter upgrades and differ by
          # ref scope, producing stale findings between push and PR runs.
          skip-cache: true

  goreleaser-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Resolve GoReleaser version
        id: tool-versions
        run: |
          VERSION="$(awk '$1 == "goreleaser" { print $2 }' .tool-versions)"
          test -n "$VERSION"
          echo "goreleaser=v${VERSION#v}" >> "$GITHUB_OUTPUT"
          APP_VERSION="$(tr -d '[:space:]' < backend/cmd/server/VERSION)"
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+custom\.[0-9]{3}$ ]]
          echo "docker_tag_version=v${APP_VERSION/+custom./-custom.}" >> "$GITHUB_OUTPUT"
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: ${{ steps.tool-versions.outputs.goreleaser }}
          args: check
        env:
          GITHUB_REPO_OWNER: validation
          GITHUB_REPO_OWNER_LOWER: validation
          GITHUB_REPO_NAME: sub2api-plus
          DOCKER_TAG_VERSION: ${{ steps.tool-versions.outputs.docker_tag_version }}
          DOCKERHUB_USERNAME: skip
          TAG_MESSAGE: GoReleaser configuration validation only.

  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Lint GitHub Actions workflows
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: Test release policy
        run: python tools/test_release_policy.py
      - name: Test repository CLIs
        run: |
          python skills/compress-cli/tests/test_compress_cli.py
          python skills/push-cli/tests/test_push_cli.py
          python skills/release-cli/tests/test_release_cli.py
      - name: Check OpenAI Codex outbound identity
        run: python tools/check_openai_codex_identity.py
      - name: Check README synchronization
        run: python tools/check_readme_sync.py
      - name: Check release metadata sources
        env:
          SUB2API_CUSTOM_ITERATION_MIN: ${{ github.repository == 'Tiantianr/sub2api-plus' && '901' || '1' }}
        run: python tools/check_release.py
      - name: Check migration changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python tools/check_new_migrations.py --target-release "$RELEASE_TAG"
          else
            python tools/check_new_migrations.py --base "$BASE_SHA"
          fi

  linux-image-artifact:
    name: linux-image-artifact
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve image metadata
        id: metadata
        run: |
          VERSION="$(tr -d '[:space:]' < backend/cmd/server/VERSION)"
          DATE="$(git show -s --format=%cI "$GITHUB_SHA")"
          {
            echo "version=$VERSION"
            echo "date=$DATE"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build validated Linux image artifact
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          tags: sub2api-linux-arm64:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/sub2api-linux-arm64.tar
          provenance: false
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.metadata.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=sub2api-linux-arm64
          cache-to: type=gha,mode=max,scope=sub2api-linux-arm64
      - name: Smoke test Linux image artifact
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          docker load --input "$RUNNER_TEMP/sub2api-linux-arm64.tar"
          IMAGE="sub2api-linux-arm64:$GITHUB_SHA"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = "linux/arm64"
          docker run --rm "$IMAGE" /app/sub2api --version | grep -F "$VERSION"
      - name: Upload validated Linux image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-image-${{ github.sha }}
          path: ${{ runner.temp }}/sub2api-linux-arm64.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
