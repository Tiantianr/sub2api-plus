name: Fast Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (format: vX.Y.Z+custom.NNN)"
        required: true
        type: string
      notes:
        description: "Release notes (optional)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish-fast-image:
    name: Build and publish fast release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve metadata
        id: metadata
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG_NAME="$INPUT_TAG"
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+custom\.[0-9]{3}$ ]]; then
            echo "Invalid release tag format: $TAG_NAME. Expected vX.Y.Z+custom.NNN" >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          OCI_TAG="${TAG_NAME/+/-}"
          OWNER_LOWER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          GHCR_IMAGE="ghcr.io/$OWNER_LOWER/sub2api-plus:$OCI_TAG"
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          {
            echo "tag=$TAG_NAME"
            echo "version=$VERSION"
            echo "oci_tag=$OCI_TAG"
            echo "ghcr_image=$GHCR_IMAGE"
            echo "date=$DATE"
          } >> "$GITHUB_OUTPUT"
          echo "Release target: $TAG_NAME ($GHCR_IMAGE)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fast Linux arm64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.ghcr_image }}
          provenance: false
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.metadata.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=sub2api-linux-arm64
          cache-to: type=gha,mode=max,scope=sub2api-linux-arm64

      - name: Create or update Release and Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.metadata.outputs.tag }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag -a "$TAG_NAME" -m "Sub2API Plus $TAG_NAME"
            git push origin "$TAG_NAME" || true
          fi

          NOTES="${INPUT_NOTES:-Sub2API Plus $TAG_NAME}"
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --title "Sub2API Plus $TAG_NAME" \
              --notes "$NOTES"
          fi
          echo "Fast Release $TAG_NAME completed."
