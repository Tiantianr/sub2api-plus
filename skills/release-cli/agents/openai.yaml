interface:
  display_name: "Sub2API Release CLI"
  short_description: "Prepare, tag, publish, and verify releases safely"
  default_prompt: "Use $release-cli to verify the exact push-cli submit-pr proof, promote the PR through protected GitHub auto-merge, wait for Actions at the resulting main merge commit, run focused release metadata validation, require the automatic tag-only release Environment and immutable custom-tag ruleset before publication, and keep tag, publish, monitor, and verify as explicit resumable actions. Treat successful verify as the end of a personal release, defer its published mapping to the next release PR, and use finalize only when immediate metadata is explicitly required. Never use admin bypass, approve a deployment, or repeat the full local application matrix."
